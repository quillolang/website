# Top of the repository.
root = true

[*]
charset = UTF-8
end_of_line = LF
insert_final_newline = true
trim_trailing_whitespace = true
indent_style = space
indent_size = 4

[*.{js,ts,jsx}]
indent_size = 2

[Makefile]
indent_style = tab

[*.md]
trim_trailing_whitespace = unset
max_line_length = off

[lib/**.py]
max_line_length = 79

[{package.json,.travis.yml}]
indent_size = 2

[test/{1..3}/*.txt]
end_of_line = crlf
my_plugin_key = KeepCase
