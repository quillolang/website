openapi: 3.0.3
info:
  title: Pet Shop
  version: 1.4.0
  description: A small example API for the openapi plugin.
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
  - name: orders
paths:
  /pets:
    get:
      operationId: listPets
      summary: List the pets
      tags: [pets]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: species
          in: query
          schema: { type: string, enum: [cat, dog, bird] }
      responses:
        '200':
          description: The pets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Pet' } }
    post:
      operationId: addPet
      summary: Add a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '201': { description: Added }
        '422': { description: Not a valid pet }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        schema: { type: integer }
    get:
      operationId: getPet
      summary: One pet
      tags: [pets]
      responses:
        '200': { description: The pet }
        '404': { description: No such pet }
    delete:
      operationId: deletePet
      deprecated: true
      tags: [pets]
      responses:
        '204': { description: Gone }
  /pets/mine:
    get:
      operationId: myPets
      tags: [pets]
      responses:
        '200': { description: Your pets }
  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Placed }
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, maximum: 100 }
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer }
        name: { type: string }
